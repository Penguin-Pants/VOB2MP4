name: Build Windows portable

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch FFmpeg (Windows static)
        run: npm run fetch-ffmpeg

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build portable .exe
        run: npm run build:win

      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: VOB2MP4-portable
          path: dist/*portable*.exe
          if-no-files-found: error
          retention-days: 30
